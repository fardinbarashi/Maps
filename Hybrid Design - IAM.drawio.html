y&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-102\&quot; parent=\&quot;1\&quot; style=\&quot;image;aspect=fixed;perimeter=ellipsePerimeter;html=1;align=center;shadow=0;dashed=0;spacingTop=3;image=img/lib/active_directory/windows_server_2.svg;\&quot; value=\&quot;Certificate Server\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;50\&quot; width=\&quot;40\&quot; x=\&quot;403\&quot; y=\&quot;390\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-107\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;FPqMHxv_qP33vrG37nPg-106\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;entryX=0;entryY=0.5;entryDx=0;entryDy=0;\&quot; target=\&quot;4FQhoqOVi--SD7Q3llwU-4\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-108\&quot; connectable=\&quot;0\&quot; parent=\&quot;FPqMHxv_qP33vrG37nPg-107\&quot; style=\&quot;edgeLabel;html=1;align=center;verticalAlign=middle;resizable=0;points=[];\&quot; value=\&quot;Employment LOA3\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; x=\&quot;-0.2462\&quot; y=\&quot;-2\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;mxPoint as=\&quot;offset\&quot; /&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-106\&quot; parent=\&quot;1\&quot; style=\&quot;image;aspect=fixed;html=1;points=[];align=center;fontSize=12;image=img/lib/azure2/identity/Groups.svg;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;56.00000000000001\&quot; width=\&quot;68\&quot; x=\&quot;-400\&quot; y=\&quot;82.5\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-110\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;\&quot; value=\&quot;Text\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;30\&quot; width=\&quot;60\&quot; x=\&quot;610\&quot; y=\&quot;180\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-114\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;aspect=fixed;fillColor=light-dark(#FFFFFF,#000000);fontColor=light-dark(#000000,#FF9999);\&quot; value=\&quot;&amp;lt;div class=&amp;quot;heading-wrapper&amp;quot;&amp;gt;&amp;lt;h3 id=&amp;quot;tier-0---identity-control-plane&amp;quot; class=&amp;quot;heading-anchor&amp;quot;&amp;gt;Tier 0 - Identity control plane&amp;lt;/h3&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;p&amp;gt;Tier 0 contains assets and identities that directly or indirectly control the directory service and enterprise-wide permissions:&amp;lt;/p&amp;gt;&amp;lt;div align=&amp;quot;left&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;Tier 0 administrative accounts and groups, including built-in Active&amp;lt;br&amp;gt; Directory groups such as Backup Operators and Server Operators.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;AD DS domain controllers and core directory service components.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;Identity services such as Microsoft Entra Connect, Microsoft Entra &amp;lt;br&amp;gt;application proxy, Active Directory Federation Services (AD FS), and &amp;lt;br&amp;gt;Active Directory Certificate Services (AD CS).&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;Systems that operate or manage Tier 0 identity systems, including &amp;lt;br&amp;gt;backup, monitoring, patching, hypervisor, antivirus, and endpoint &amp;lt;br&amp;gt;detection and response (EDR) solutions, or any agent with direct &amp;lt;br&amp;gt;operating system-level or AD-object-level control.&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;430\&quot; width=\&quot;430\&quot; x=\&quot;-190\&quot; y=\&quot;-600\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-115\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;aspect=fixed;fillColor=light-dark(#000000,#000000);fontColor=light-dark(#000000,#FAFFBA);\&quot; value=\&quot;&amp;lt;div class=&amp;quot;heading-wrapper&amp;quot;&amp;gt;&amp;lt;h3 id=&amp;quot;tier-1---enterprise-server-and-application-management&amp;quot; class=&amp;quot;heading-anchor&amp;quot;&amp;gt;Tier 1 - Enterprise server and application management&amp;lt;/h3&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;p&amp;gt;Tier 1 contains member servers and the identities that manage them:&amp;lt;/p&amp;gt;&amp;lt;br&amp;gt;&amp;lt;div align=&amp;quot;left&amp;quot;&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;Member servers and server administrator roles.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;IT infrastructure management (ITIM) solutions that control Tier 1 servers.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;Microsoft server applications such as Exchange Server, SharePoint Server, and SQL Server.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;Third-party server solutions.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;LOB applications.&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;340\&quot; width=\&quot;340\&quot; x=\&quot;330\&quot; y=\&quot;-600\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-116\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;aspect=fixed;fontColor=light-dark(#000000,#97D077);\&quot; value=\&quot;&amp;lt;div class=&amp;quot;heading-wrapper&amp;quot;&amp;gt;&amp;lt;h3 id=&amp;quot;tier-2---end-user-account-and-device-support&amp;quot; class=&amp;quot;heading-anchor&amp;quot;&amp;gt;Tier 2 - End-user account and device support&amp;lt;/h3&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;p align=&amp;quot;left&amp;quot;&amp;gt;Tier 2 contains the identities that manage end-user devices and &amp;lt;br&amp;gt;accounts, including help desk and device support roles, end-user device &amp;lt;br&amp;gt;administrator roles, and end-user account administrator roles.&amp;lt;/p&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;284.6\&quot; width=\&quot;284.6\&quot; x=\&quot;760\&quot; y=\&quot;-600\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-117\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;aspect=fixed;\&quot; value=\&quot;&amp;lt;div class=&amp;quot;heading-wrapper&amp;quot;&amp;gt;&amp;lt;h3 id=&amp;quot;tier-model-design-principles&amp;quot; class=&amp;quot;heading-anchor&amp;quot;&amp;gt;Tier model design principles&amp;lt;/h3&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;p&amp;gt;Apply these principles when you decide whether an asset, account, or solution belongs in a particular tier:&amp;lt;/p&amp;gt;&amp;lt;br&amp;gt;&amp;lt;div align=&amp;quot;left&amp;quot;&amp;gt;&amp;lt;ul&amp;gt;&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Least privilege within each tier.&amp;lt;/strong&amp;gt; Even within Tier 0, not every account needs Domain Admins rights. Scope permissions to the minimum required for each role.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;No shared credentials across tiers.&amp;lt;/strong&amp;gt; An account, &amp;lt;br&amp;gt;service account, or group must operate in a single tier. Reusing &amp;lt;br&amp;gt;credentials across tiers collapses the trust boundary.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;No line-of-business workloads in Tier 0.&amp;lt;/strong&amp;gt; Application servers, business apps, and general-purpose workloads belong in Tier 1, even when an AD admin owns them.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Separation of duties.&amp;lt;/strong&amp;gt; Keep operators, approvers, &amp;lt;br&amp;gt;and auditors as distinct roles, especially in Tier 0. Avoid &amp;lt;br&amp;gt;concentrating all privileged functions in a single team.&amp;lt;/li&amp;gt;&amp;lt;li&amp;gt;&amp;lt;strong&amp;gt;Containment, not perimeter, is the boundary.&amp;lt;/strong&amp;gt; &amp;lt;br&amp;gt;Network segmentation supports the model but doesn&amp;#39;t replace it. The &amp;lt;br&amp;gt;credential and the keyboard define the tier, not the IP address&amp;lt;/li&amp;gt;&amp;lt;/ul&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;520\&quot; width=\&quot;520\&quot; x=\&quot;220\&quot; y=\&quot;-1160\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-150\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;FPqMHxv_qP33vrG37nPg-125\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;entryX=0.5;entryY=0;entryDx=0;entryDy=0;strokeWidth=3;dashed=1;dashPattern=1 1;strokeColor=light-dark(#000000,#990000);\&quot; target=\&quot;FPqMHxv_qP33vrG37nPg-146\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;FPqMHxv_qP33vrG37nPg-125\&quot; parent=\&quot;1\&quot; style=\&quot;image;aspect=fixed;html=1;points=[];align=center;fontSize=12;image=img/lib/azure2/security/Conditional_Access.svg;labelBackgroundColor=#f8cecc;labelBorderColor=#b85450;imageBackground=default;imageBorder=light-dark(#000000,#660000);\&quot; value=\&quot;TIER 0\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;68\&quot; width=\&quot;56.00000000000001\&quot; x=\&quot;1160\&quot; y=\&quot;-328\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n
